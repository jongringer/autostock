# ============================================================================
# ALPHA SHIELD v3.3 (6-1-F) — 전략 파라미터
# 2026-11-27 KST 개정안(자금·버퍼 정합성, EOD 쿨다운, Hark 2 상한 캡, 15시 마감
# 프로토콜, 데이터·계좌 안전장치)을 반영했습니다.
# 숫자를 바꾸면 백테스트 기준값(2년 +48.68%, MDD -10.18%, 샤프 2.05)이 무효가 됩니다.
# ============================================================================

universe:
  # 알파 가중치 (슬롯 경쟁 점수 = 알파 가중치 x min(|낙폭| / |진입 임계|, 상한 배수))
  NVDA: 1.5
  TSLA: 1.4
  AMZN: 1.2
  TSM: 1.1
  AVGO: 1.0
  QQQ: 1.0
  AAPL: 0.9
  GOOGL: 0.9

capital:
  slots: 2                       # 항상 2슬롯 고정 (자산 규모와 무관)
  plan: A                        # A(권장) 3단 사이징 · B $500 미만 $85/$170 + 부분 물타기
  tiers:                         # 자산 구간별 1회 진입 / 종목 상한 (자산 오름차순)
    - max_equity_usd: 400.00     # 자산 < $400
      entry_usd: 75.00
      symbol_cap_usd: 150.00
    - max_equity_usd: 500.00     # $400 ~ $500 미만
      entry_usd: 85.00
      symbol_cap_usd: 170.00
    - max_equity_usd: null       # 자산 >= $500
      entry_usd: 120.00
      symbol_cap_usd: 240.00
  cash_buffer_pct: 0.15          # 현금 안전 버퍼 = max(자산 x 15%, $55)
  cash_buffer_min_usd: 55.00
  min_order_usd: 10.00           # $10 미만 주문 금지

entry:
  atr_period: 20
  atr_drawdown_multiple: 0.52    # 장중 고점 대비 -0.52 x ATR(20)% 이상 눌림
  rsi_period: 2
  rsi_max: 15                    # RSI(2) <= 15
  chase_rsi_block: 70            # RSI(2) >= 70 이면 추격 매수 차단
  sma_period: 200
  sma_floor_ratio: 0.95          # 주가 >= SMA200 x 0.95 (v3.3 상향)
  score_cap_multiple: 2.5        # 점수 낙폭 비율 최대 2.5배 상한 캡
  crash_atr_multiple: 3.0        # -3.0 x ATR(20)% 초과 급락은 당일 신규 매수 제외
  # ATR 결측 시 종목별 고정 낙폭 임계(%)
  atr_fallback_pct:
    QQQ: 0.7
    AAPL: 1.0
    GOOGL: 1.0
    AMZN: 1.3
    __default__: 1.5
  signal_ttl_seconds: 900        # BUY 신호 15분 만료
  signal_redelivery_rsi_max: 25  # 재전달 전 최신 RSI(2) > 25 이면 폐기 (미확인 시 fail-closed)
  hod_outlier_filter: true       # 1분봉 이상 체결 필터로 장중 고점 산출

add:
  trigger_pct: 1.5               # 평단 대비 최소 -1.5% 추가 하락
  atr_multiple: 0.8              # 또는 0.8 x ATR(20)% (둘 중 큰 값)
  rsi_max: 35                    # RSI(2) <= 35
  max_adds: 1                    # 종목당 물타기 최대 1회
  min_interval_hours: 2          # 1차 진입 후 최소 2시간(또는 익거래일) 경과

exit:
  stop_loss_pct: 5.0             # 단일 진입 -5.0%
  stop_loss_added_pct: 3.5       # 물타기 포지션 -3.5%
  preemptive_near_stop_pct: 0.5  # 14:50~14:58 ET 손절선 0.5%p 이내 선제 청산
  take_profit_vix_low: 18.0      # 진입 시 확정 VIX 종가 < 18.0
  take_profit_low_vix_pct: 8.0   #  -> +8.0%
  take_profit_high_vix_pct: 5.0  # VIX >= 18.0 또는 미확인 -> +5.0%
  time_exit_trading_days: 10     # 최초 진입일 기준 10거래일
  time_exit_calendar_days: 14    # 또는 달력 14일
  trailing_on_time_exit: true    # 만기 시 +3.0% 이상이면 트레일링으로 전환
  trailing_trigger_pct: 3.0
  trailing_drawdown_pct: 2.0     # 고점 대비 -2.0% 이탈 시 청산
  cooldown_seconds: 900          # 일반 청산 후 재진입 15분 쿨다운
  stop_loss_eod_cooldown: true   # 동일 종목 손절 시 당일 재진입 금지 (EOD)
  force_exit_buffer_min: 15      # 마감 15분 전부터 신규 매수 금지 (청산은 계속)

paper:
  starting_cash_usd: 380.00
  slippage_bps: 5                # 시장가 체결 가정 슬리피지 0.05%
  commission_bps: 10             # 미국 주식 수수료 0.10% (왕복 0.2%)
