[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-shield"
version = "3.2.0"
description = "ALPHA SHIELD v3.2 (6-1-F) — 미국장 2슬롯 소수점 자동매매 시스템"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "jongringer" }]
dependencies = ["PyYAML>=6.0", "tzdata>=2024.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
alpha-shield = "alpha_shield.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
